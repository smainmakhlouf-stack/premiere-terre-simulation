<script>
/* Champs de montants : au clic, le contenu est sélectionné (un « 0 » est remplacé par la frappe au lieu de
   donner « 0250000 ») ; un zéro resté devant un nombre est retiré pendant la saisie. */
(function(){
  const chiffre=el=>el&&el.tagName==='INPUT'&&(el.type==='number'||/numeric|decimal/.test(el.inputMode||'')||!!el.closest('.euro'));
  // Sélection immédiate ; au clic de souris, le relâchement ne doit pas la remplacer par un curseur.
  let vientDeFocus=null;
  document.addEventListener('focusin',e=>{const el=e.target;if(!chiffre(el))return;try{el.select()}catch(_){}vientDeFocus=el});
  document.addEventListener('mouseup',e=>{if(vientDeFocus&&e.target===vientDeFocus)e.preventDefault();vientDeFocus=null},true);
  document.addEventListener('input',e=>{const el=e.target;if(!chiffre(el)||el.type==='number')return;const v=el.value;if(/^0+\d/.test(v)){const pos=el.selectionStart,n=v.replace(/^0+(?=\d)/,''),k=Math.max(0,pos-(v.length-n.length));el.value=n;try{el.setSelectionRange(k,k)}catch(_){}}},true);
})();
/* Retour à l'accueil depuis n'importe quel écran (bouton de la barre du haut). */
window.ptAllerAccueil=function(){
  const ouvert=id=>document.getElementById(id)?.classList.contains('open'),h0=document.getElementById('pt-home');
  const surSimulation=ouvert('pt-studio')||ouvert('pt-diagnostic')||document.body.classList.contains('v9clientmode')||(h0&&getComputedStyle(h0).display==='none'&&!['pt-ptz','pt-dos','pt-par'].some(ouvert));
  if(surSimulation&&window.ptFermerSimulation)return window.ptFermerSimulation();
  ['pt-studio','pt-diagnostic','pt-ptz','pt-dos','pt-par'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('open')});
  if(document.body.classList.contains('v9clientmode')){document.body.classList.remove('v9clientmode');const b=document.getElementById('v9present');if(b)b.textContent='Présentation client'}
  const h=document.getElementById('pt-home');if(h)h.style.display='block';
  document.body.style.overflow='';window.scrollTo(0,0);
};
// Le bouton n'apparaît que hors de l'accueil (et hors des écrans qui ont le leur).
(function(){
  const ids=['pt-studio','pt-diagnostic','pt-ptz','pt-dos','pt-par'];
  function maj(){
    const b=document.getElementById('pt-btn-accueil'),h=document.getElementById('pt-home');if(!b)return;
    const surAccueil=h&&getComputedStyle(h).display!=='none'&&!ids.some(id=>document.getElementById(id)?.classList.contains('open'))&&!document.body.classList.contains('v9clientmode');
    // Les écrans Budget max / Plan / Optimiseur ont déjà leur propre « ← Accueil » : pas de doublon.
    const studio=document.getElementById('pt-studio')?.classList.contains('open');
    b.style.visibility=surAccueil||studio?'hidden':'visible';
  }
  const obs=new MutationObserver(maj),cibles=[document.body,document.getElementById('pt-home'),...ids.map(id=>document.getElementById(id))].filter(Boolean);
  cibles.forEach(el=>obs.observe(el,{attributes:true,attributeFilter:['class','style']}));
  maj();
})();
</script>
</html>
