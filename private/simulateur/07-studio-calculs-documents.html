<script>
(function(){
const $=id=>document.getElementById(id);
const C={main:'#a34d31',aide:'#d99a2b',apport:'#2f8a5a',frais:'#4a6fd1'};
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Math.round(n||0));
const pc=(n,d=1)=>(Math.round((n||0)*10**d)/10**d).toLocaleString('fr-FR')+' %';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(String(v??'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:0};
const P=()=>window.ptParametres||{taux:[{t10:3,t15:3.1,t20:3.2,t25:3.35}],assurance:{tranches:[{taux:.1},{taux:.15}],quotiteCouple:100},frais:{notaireNeuf:2.5,notaireAncien:7.5,dossier:1000,courtagePct:1},seuils:{endettement:35,resteAdulte:800,resteEnfant:300,apportMin:10}};
const tauxDuree=a=>{const g=P().taux[0];return a<=10?g.t10:a<=15?g.t15:a<=20?g.t20:g.t25};
const studio=$('pt-studio');let vue='plan';

// ---------- Infobulle commune ----------
const tip=$('st-tip');
studio.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}tip.innerHTML=t.dataset.tip;tip.style.display='block';const x=Math.min(innerWidth-tip.offsetWidth-10,e.clientX+14);tip.style.left=x+'px';tip.style.top=(e.clientY+16)+'px'});
studio.addEventListener('mouseleave',()=>tip.style.display='none');

// ---------- Accès au moteur du plan de financement ----------
const fv=id=>num(document.getElementById(id)?.value);
function poser(id,v){const el=document.getElementById(id);if(!el)return;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
function recalc(){if(typeof calc==='function')calc()}
/** Taux, durée et assurance du prêt principal : écrits ensemble, sans déclencher d'événement champ par
 *  champ (le moteur relirait sinon un taux pas encore mis à jour et écraserait la saisie). */
function fixerPrincipal(rate,years,insurance){
  window.mainSettings={rate:+rate||0,years:+years||25,insurance:+insurance||0};
  [['mainRate',rate],['mainYears',years],['mainIns',insurance]].forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v});
  recalc();
}
function principal(){if(window.mainSettings)return;window.mainSettings={rate:fv('mainRate')||tauxDuree(fv('mainYears')||25),years:fv('mainYears')||25,insurance:fv('mainIns')||.15}}
function fraisAuto(){
  // Notaire, garantie et courtage suivent les paramètres de l'équipe quand le prix ou le montage change.
  const p=P(),ancien=$('v9operation')?.value==='old';
  const offert=!ancien&&m('pl-notoff')?.value==='oui';
  poser('notary',offert?0:Math.round(fv('price')*(ancien?p.frais.notaireAncien:p.frais.notaireNeuf)/100));
  recalc();
  // Garantie et courtage dépendent du prêt principal, qui dépend lui-même de ces frais : on recalcule jusqu'à stabilité.
  const g=window.ptTauxGarantie($('guarantee')?.value)??0;
  // Garantie des prêts complémentaires : même barème, selon la garantie choisie pour chacun.
  const gAutres=(typeof loans!=='undefined'?loans:[]).reduce((s,l)=>s+(+l.amount||0)*((l.garantie&&l.garantie!=='none'?window.ptTauxGarantie(l.garantie):0)||0)/100,0);
  for(let k=0;k<6;k++){
    const pret=window.loanOutputs?.[0]?.amount||0,gf=Math.round(pret*g/100+gAutres),cf=Math.round(pret*p.frais.courtagePct/100);
    if(gf===fv('guaranteeFee')&&cf===fv('brokerFee'))break;
    poser('guaranteeFee',gf);poser('brokerFee',cf);recalc();
  }
}

// ---------- Durée : curseur + saisie exacte ----------
function champDuree(id,label,val,memo){
  return `<div class="f"><label for="${id}-n">${label}</label><div class="duree"><input autocomplete="off" id="${id}" type="range" min="1" max="30" step="1" value="${val}" aria-label="${label}" ${memo?`data-memo="${memo}"`:''}><div class="euro" data-u="ans"><input autocomplete="off" id="${id}-n" type="number" min="1" max="30" step="1" inputmode="numeric" value="${val}"></div></div></div>`;
}
/** Relie le curseur et la case ; appelle surChange(années) avec une valeur bornée entre 1 et 30. */
function lierDuree(id,surChange){
  const r=$(id),n=$(id+'-n');
  r.addEventListener('input',()=>{n.value=r.value;surChange(+r.value)});
  n.addEventListener('input',()=>{const v=Math.round(num(n.value));if(v>=1&&v<=30){r.value=v;surChange(v)}});
  n.addEventListener('change',()=>{const v=Math.min(30,Math.max(1,Math.round(num(n.value))||r.value));n.value=v;r.value=v;surChange(v)});
}

// ---------- Graphiques (SVG) ----------
function barre100(parts,h=34){
  const tot=parts.reduce((s,p)=>s+Math.max(0,p.v),0)||1;let x=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const w=p.v/tot*100,s=`<rect x="${x}%" y="0" width="calc(${w}% - 2px)" height="${h}" rx="4" fill="${p.c}" data-tip="<b>${esc(p.l)}</b><br>${eur(p.v)} · ${pc(p.v/tot*100,0)}"></rect>`;x+=w;return s});
  // Rectangles positionnés en % : on passe par un SVG à largeur fluide.
  return `<svg width="100%" height="${h}" role="img" aria-label="${esc(parts.map(p=>p.l+' '+eur(p.v)).join(', '))}" style="display:block">${segs.join('').replace(/width="calc\(([\d.]+)% - 2px\)"/g,(m,w)=>`width="${Math.max(0,w-0.25)}%"`)}</svg>`+
    `<div class="legend">${parts.filter(p=>p.v>0).map(p=>`<span><i style="background:${p.c}"></i>${esc(p.l)} <b>${eur(p.v)}</b></span>`).join('')}</div>`;
}
function jauge(val,seuil,max=60){
  const W=100,pos=v=>Math.min(100,Math.max(0,v/max*100));const etat=val<=seuil?'ok':val<=seuil+3?'warn':'bad';
  const col={ok:'#2f8a5a',warn:'#c98a1e',bad:'#b04d3e'}[etat];
  return `<svg width="100%" height="46" role="img" aria-label="Taux d'endettement ${pc(val)} pour un seuil de ${pc(seuil,0)}" style="display:block;overflow:visible">
  <rect x="0" y="14" width="100%" height="12" rx="6" fill="#f1e7e1"></rect><rect x="0" y="14" width="${pos(val)}%" height="12" rx="6" fill="${col}" data-tip="Taux d'endettement : <b>${pc(val)}</b>"></rect>
  <line x1="${pos(seuil)}%" x2="${pos(seuil)}%" y1="8" y2="32" stroke="#2b2320" stroke-width="2"></line><text x="${pos(seuil)}%" y="44" text-anchor="middle" font-size="11" fill="#5e4f48">seuil ${pc(seuil,0)}</text></svg>`;
}
function statut(etat,txt){const ic={ok:'✓',warn:'!',bad:'✕'}[etat];return `<em class="${etat}"><span aria-hidden="true">${ic}</span>${esc(txt)}</em>`}
function colonnesAnnees(series,annees){
  // Barres empilées par année (mensualité moyenne), une couleur par type de prêt.
  const W=760,H=230,L=58,B=26,T=10,PW=W-L-10,PH=H-T-B;
  const tot=annees.map((_,i)=>series.reduce((s,se)=>s+se.v[i],0)),max=Math.max(1,...tot);
  const pas=[1,2,5,10,20,50,100,200,500,1000,2000,5000].find(p=>max/p<=5)||5000,top=Math.ceil(max/pas)*pas;
  const y=v=>T+PH-v/top*PH,bw=Math.max(3,PW/annees.length-3);
  let g='';for(let v=0;v<=top;v+=pas)g+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#efe5df"></line><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8a7a70">${eur(v)}</text>`;
  let bars='';annees.forEach((a,i)=>{let base=0;const x=L+i*(PW/annees.length)+1.5;const det=series.filter(s=>s.v[i]>0.5).map(s=>`${esc(s.l)} : ${eur(s.v[i])}`).join('<br>');
    series.forEach((s,k)=>{const v=s.v[i];if(v<=0.5)return;const y1=y(base+v),h=y(base)-y1-(base>0?2:0);bars+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,h)}" rx="${k===series.length-1||true?3:0}" fill="${s.c}"></rect>`;base+=v});
    bars+=`<rect x="${x-1.5}" y="${T}" width="${bw+3}" height="${PH}" fill="transparent" data-tip="<b>Année ${a}</b><br>${det||'—'}<br>Total : <b>${eur(tot[i])}</b>/mois"></rect>`;
    if(a===1||a%5===0)bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8a7a70">${a}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mensualités moyennes par année">${g}${bars}</svg><div class="legend">${series.filter(s=>s.v.some(v=>v>0.5)).map(s=>`<span><i style="background:${s.c}"></i>${esc(s.l)}</span>`).join('')}<span style="color:#8a7a70">Survolez une année pour le détail.</span></div>`;
}
function barresH(items,fmt=eur){
  // Barres horizontales autour d'un zéro (valeurs positives ou négatives).
  const max=Math.max(1,...items.map(i=>Math.abs(i.v))),neg=items.some(i=>i.v<0);
  return items.map(i=>{const w=Math.abs(i.v)/max*(neg?50:100),gauche=neg?(i.v<0?50-w:50):0;
    return `<div style="margin:10px 0" data-tip="<b>${esc(i.l)}</b><br>${esc(i.d||'')}"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${esc(i.l)}${i.badge?` <em class="ok" style="font-style:normal;font-size:11px;padding:2px 7px;border-radius:20px">${esc(i.badge)}</em>`:''}</span><b style="font-variant-numeric:tabular-nums">${fmt(i.v)}</b></div>
    <div style="position:relative;height:14px;background:#f6eee9;border-radius:7px">${neg?'<div style="position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#cdb9ad"></div>':''}<div style="position:absolute;left:${gauche}%;width:${w}%;top:0;bottom:0;border-radius:4px;background:${i.c||C.main}"></div></div></div>`}).join('');
}

// =====================================================================
// 1. PLAN DE FINANCEMENT
// =====================================================================
let tauxPlanManuel=false,ouvertPret=null;
// ---------- Onglets PTZ / Action Logement (conditions et plafonds de ressources) ----------
let ongletAide='';
const nbP=n=>n+' personne'+(n>1?'s':'');
function infoPTZ(){
  const B=window.ptBaremePTZ?window.ptBaremePTZ():null,dejaPtz=(typeof loans!=='undefined'?loans:[]).some(l=>l.type==='ptz');
  if(!B)return '<p class="hint">Barème PTZ indisponible.</p>';
  const coef=[1,1.5,1.8,2.1,2.4,2.7,3,3.3],Z=[['A','A bis / A'],['B1','B1'],['B2','B2'],['C','C']];
  const fr=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n));
  return `<p><b>Prêt à taux zéro</b> : prêt de l'État sans intérêts qui complète le prêt bancaire, pour l'achat de la <b>résidence principale</b> d'un <b>primo-accédant</b> (pas propriétaire de sa résidence principale depuis 2 ans).</p>
  <ul><li>Neuf collectif : partout en France. Maison individuelle neuve : quotité réduite. Ancien : seulement avec travaux, en zones B2 et C.</li>
  <li>Montant = quotité (20 à 50 %) × coût de l'opération plafonné (${fr(B.plafond.A)} € pour 1 personne en zone A, plus selon le foyer).</li>
  <li>Remboursement sur ${B.duree[3]} à ${B.duree[0]} ans, avec un différé de 0 à ${B.differe[0]} ans selon la tranche de revenus.</li></ul>
  <div class="t-titre">Revenu fiscal de référence (N-2) à ne pas dépasser</div>
  <table class="t-aide"><tr><th>Occupants</th>${Z.map(z=>`<th>Zone ${z[1]}</th>`).join('')}</tr>${coef.map((c,i)=>`<tr><td>${i===7?'8 et +':nbP(i+1)}</td>${Z.map(z=>`<td>${fr(B.revenus[z[0]][3]*c)} €</td>`).join('')}</tr>`).join('')}</table>
  <p class="hint">Barème du simulateur (Paramètres → Barème PTZ). Plus les revenus sont bas, plus la quotité et le différé sont élevés (4 tranches).</p>
  ${dejaPtz?'<p class="hint"><b>Un PTZ est déjà dans le plan</b> : recalculez-le avec le barème pour le remplacer.</p><button type="button" class="mini" id="sp-ptz">Recalculer le PTZ (barème)</button>':'<button type="button" class="mini" id="sp-ptz">+ Ajouter le PTZ (barème)</button>'}`;
}
// Plafonds Action Logement (prêt accession) : grille « logements intermédiaires » au 10/03/2026 (actionlogement.fr).
const PLAFONDS_AL={zones:['A bis / A','B1','B2 et C'],lignes:[['1 personne seule',[44344,36144,32530]],['2 personnes',[66276,48268,43439]],['3 personnes (ou 1 + 1 à charge)',[79666,58043,52239]],['4 personnes (ou 1 + 2 à charge)',[95427,70073,63066]],['5 personnes (ou 1 + 3 à charge)',[112968,82432,74189]],['6 personnes (ou 1 + 4 à charge)',[127122,92900,83611]],['Par personne en plus',[14164,10364,9325],'+']],abis:[44344,66276,86878,103727,123415,138874,15471]};
// Montant proposé : 40 % du coût de l'opération, plafonné à 30 000 €.
// Valeurs par défaut du prêt Action Logement (modifiables ensuite) ; Action Logement le limite à 40 % du coût de l'opération.
const AL_DEFAUT={montant:30000,taux:1,ans:25};
const limiteAL=()=>{const cout=fv('price')+fv('works')+fv('notary');return cout>0?cout*0.4:Infinity};
// Plafond de revenus du foyer selon la zone et le nombre d'occupants (saisis dans Budget max).
function controleAL(){
  const b=lireDiagBase(),rfr=num(m('dg-rfr').value)||fv('v9rfr'),occ=Math.max(1,num(m('dg-occ').value)||((b.adultes||1)+(b.enfants||0)));
  const z=m('dg-zone').value||'A',col=z==='A'?0:z==='B1'?1:2,L=PLAFONDS_AL.lignes;
  const plafond=occ<=6?L[occ-1][1][col]:L[5][1][col]+(occ-6)*L[6][1][col];
  return {ancien:$('v9operation')?.value==='old',rfr,occ,zone:PLAFONDS_AL.zones[col],plafond};
}
window.ptPlafondsAL=PLAFONDS_AL;
/** Ajout depuis « Prêts et aides » : remplace le prêt Action Logement existant, avec l'assurance et la garantie du prêt principal. */
window.ptAjouterAL=(montant,taux,ans)=>{
  if(typeof loans==='undefined')return;for(let i=loans.length-1;i>=0;i--)if(loans[i].type==='action')loans.splice(i,1);
  addLoan({name:'Prêt Action Logement',type:'action',amount:montant,rate:taux??1,years:ans||25,delay:0,insurance:window.mainSettings?.insurance??fv('mainIns')??0.15,garantie:$('guarantee')?.value||'none',suit:true});
  fraisAuto();if(studio.classList.contains('open'))rafraichir();
};
function infoAL(){
  const fr=n=>new Intl.NumberFormat('fr-FR').format(n),deja=(typeof loans!=='undefined'?loans:[]).some(l=>l.type==='action');
  const k=controleAL(),rouge='background:#f9e3e1;border:1px solid #e9b8b3;color:#9d3535',vert='background:#e6f2e8;border:1px solid #b9d8c0;color:#2f6b45',gris='background:#f3ede8;border:1px solid #e3d6cc;color:#5e4f48';
  const ctrl=k.ancien?[rouge,'<b>✕ Non éligible</b> : le prêt Action Logement est réservé au <b>neuf</b>.']
    :!k.rfr?[gris,`Plafond pour ce foyer (${nbP(k.occ)}, zone ${k.zone}) : <b>${fr(k.plafond)} €</b>. Renseignez le RFR N-2 dans « Budget max » pour le vérifier.`]
    :k.rfr>k.plafond?[rouge,`<b>✕ Revenus trop élevés</b> : RFR ${fr(k.rfr)} € pour un plafond de ${fr(k.plafond)} € (${nbP(k.occ)}, zone ${k.zone}).`]
    :[vert,`<b>✓ Sous le plafond</b> : RFR ${fr(k.rfr)} € pour un plafond de ${fr(k.plafond)} € (${nbP(k.occ)}, zone ${k.zone}).`];
  const verdict=`<div style="${ctrl[0]};border-radius:10px;padding:8px 10px;margin:4px 0 8px">${ctrl[1]}</div>`;
  return `<p><b>Prêt accession Action Logement</b> : jusqu'à <b>30 000 €</b> à taux réduit (1 % hors assurance), en complément du prêt bancaire, pour l'achat de la <b>résidence principale dans le neuf</b>.</p>
  <ul><li>Être <b>salarié d'une entreprise du secteur privé non agricole de 10 salariés et plus</b>.</li>
  <li>Primo-accédant, ou pas propriétaire de sa résidence principale depuis 2 ans.</li>
  <li>Revenus du foyer sous les plafonds ci-dessous (revenu fiscal de référence N-2, avis 2025 sur les revenus 2024).</li></ul>
  <div class="t-titre">Revenu fiscal de référence (N-2) à ne pas dépasser</div>
  <table class="t-aide"><tr><th>Foyer</th>${PLAFONDS_AL.zones.map(z=>`<th>Zone ${z}</th>`).join('')}</tr>${PLAFONDS_AL.lignes.map(([l,v,plus])=>`<tr><td>${l}</td>${v.map(x=>`<td>${plus||''}${fr(x)} €</td>`).join('')}</tr>`).join('')}</table>
  <p class="hint">Zone A bis : mêmes plafonds que la zone A pour 1 et 2 personnes, un peu plus élevés au-delà (3 personnes : ${fr(PLAFONDS_AL.abis[2])} €). Barème Action Logement au 10 mars 2026 ; conditions définitives fixées par Action Logement.</p>
  ${verdict}
  ${(()=>{const l=(typeof loans!=='undefined'?loans:[]).find(x=>x.type==='action');return l&&+l.amount>limiteAL()?`<p class="hint" style="color:#9d3535"><b>Attention</b> : ${fr(+l.amount)} € dépasse 40 % du coût de l'opération (${fr(Math.floor(limiteAL()))} €), limite fixée par Action Logement.</p>`:''})()}
  ${deja?'<p class="hint"><b>Le prêt Action Logement est déjà dans le plan</b> (un seul par dossier) : modifiez-le dans la liste ci-dessus.</p>':`<p class="hint">Ajouté avec <b>${fr(AL_DEFAUT.montant)} €</b> à 1 % sur 25 ans (modifiable ensuite dans la liste), avec l'assurance et la garantie du prêt principal.</p><button type="button" class="mini" id="sp-al">+ Ajouter le prêt Action Logement</button>`}`;
}
function formPlan(){
  const invest=$('purpose')?.value==='invest',ancien=$('v9operation')?.value==='old',ans=fv('mainYears')||window.mainSettings?.years||25;
  // Un taux différent de la grille (saisi ou repris d'un dossier) est considéré comme choisi par le vendeur.
  const r0=window.mainSettings?.rate||fv('mainRate');if(r0&&Math.abs(r0-tauxDuree(ans))>1e-6)tauxPlanManuel=true;
  const optsGar=[['none','Aucune'],['credit','Crédit Logement'],['initio','Crédit Logement Initio'],['sacem','SACCEF'],['camca','CAMCA'],['cmh','CMH'],['socami','SOCAMI'],['casden','CASDEN'],['mutuelle','Caution mutuelle'],['hyp','Hypothèque'],['ppd','Privilège de prêteur']];
  const TYPES={ptz:'PTZ',action:'Action Logement',external:'Prêt externe',internal:'Prêt bancaire',boost:'Prêt boosté'};
  const aides=(typeof loans!=='undefined'?loans:[]).map(l=>`<details class="pret" ${ouvertPret===l.id?'open':''} data-pret="${l.id}"><summary><span><b>${esc(l.name)}</b><br>${eur(l.amount)} · ${pc(+l.rate||0,2)} · ${l.years} ans${l.delay?' · différé '+Math.round(l.delay/12*10)/10+' ans':''}${l.lissable===false?' · non lissé':''}</span><button type="button" data-suppr-pret="${l.id}" aria-label="Retirer ${esc(l.name)}">×</button></summary>
    <div class="f"><label>Nom</label><input autocomplete="off" data-k="name" value="${esc(l.name)}"></div>
    <div class="duo"><div class="f"><label>Type</label><select autocomplete="off" data-k="type">${Object.entries(TYPES).map(([v,t])=>`<option value="${v}" ${l.type===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="f"><label>Montant</label><div class="euro" data-u="€"><input autocomplete="off" data-k="amount" inputmode="numeric" value="${+l.amount||0}"></div></div></div>
    <div class="duo"><div class="f"><label>Taux</label><div class="euro" data-u="%"><input autocomplete="off" data-k="rate" inputmode="decimal" value="${+l.rate||0}"></div></div>
    <div class="f"><label>Durée totale</label><div class="euro" data-u="ans"><input autocomplete="off" data-k="years" type="number" min="1" max="30" value="${+l.years||1}" style="padding-right:38px"></div></div></div>
    <div class="duo"><div class="f"><label>Différé</label><div class="euro" data-u="mois"><input autocomplete="off" data-k="delay" type="number" min="0" value="${+l.delay||0}" style="padding-right:44px"></div></div>
    <div class="f"><label>Assurance</label><div class="euro" data-u="%"><input autocomplete="off" data-k="insurance" inputmode="decimal" value="${+l.insurance||0}"></div></div></div>
    <div class="duo"><div class="f"><label>Garantie</label><select autocomplete="off" data-k="garantie">${optsGar.map(([v,t])=>`<option value="${v}" ${(l.garantie||'none')===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="f"><label>Lissage</label><div class="seg" data-k-seg="lissable"><button type="button" data-v="1" class="${l.lissable===false?'':'on'}">Lissé</button><button type="button" data-v="0" class="${l.lissable===false?'on':''}">Non lissé</button></div></div></div>
    <div class="hint">Lissé : le prêt principal baisse pendant le remboursement de ce prêt pour garder une mensualité totale stable.</div></details>`).join('');
  $('st-form').innerHTML=`
  <h3>Le projet</h3>
  <div class="f"><div class="seg" data-seg="purpose"><button type="button" data-v="rp" class="${invest?'':'on'}">Résidence principale</button><button type="button" data-v="invest" class="${invest?'on':''}">Investissement</button></div></div>
  <div class="f"><div class="seg" data-seg="v9operation"><button type="button" data-v="new" class="${ancien?'':'on'}">Neuf</button><button type="button" data-v="old" class="${ancien?'on':''}">Ancien</button></div></div>

/** Taux actuariel mensuel d'un flux (capital reçu, mensualités versées), par dichotomie. */
function tauxReel(capital,mens){if(capital<=0||!mens.length)return 0;let lo=0,hi=0.05;const va=r=>mens.reduce((s,p,t)=>s+p/Math.pow(1+r,t+1),0);if(va(0)<=capital)return 0;for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(va(mid)>capital)lo=mid;else hi=mid}return ((lo+hi)/2)*1200}
function tablePrets(out,defs){
  const lignes=out.map((o,i)=>{const d=defs[i]||{},nom=i===0?'Prêt principal':d.name;return {nom,montant:o.amount||0,taux:i===0?(window.mainSettings?.rate||0):(+d.rate||0),ans:i===0?(window.mainSettings?.years||0):(+d.years||0),ass:i===0?(window.mainSettings?.insurance||0):(+d.insurance||0),mens:o.arr?.[0]?.pay||0,cout:(o.totalInterest||0)+(o.totalIns||0),lisse:i===0?'—':(d.lissable===false?'non':'oui'),arr:o.arr||[]}}).filter(l=>l.montant>0);
  const tot=lignes.reduce((s,l)=>s+l.montant,0);if(!tot||lignes.length<1)return '';
  const moyen=lignes.reduce((s,l)=>s+l.montant*l.taux,0)/tot,moyenAss=lignes.reduce((s,l)=>s+l.montant*l.ass,0)/tot;
  const N=Math.max(...lignes.map(l=>l.arr.length)),flux=Array.from({length:N},(_,t)=>lignes.reduce((s,l)=>s+(l.arr[t]?.pay||0),0));
  const reel=tauxReel(tot,flux);
  return `<div class="card"><h2>Détail des prêts et taux moyen</h2><p class="sub">Taux moyen pondéré par les montants (PTZ, Action Logement, prêts externes et prêt principal).</p>

  <div class="tile"><small>Assurance moyenne</small><b>${pc(moyenAss,2)}</b><em class="ok" style="background:#f3ece8;color:#5e4f48">pondérée par les montants</em></div>
  <div class="tile"><small>Taux réel du montage</small><b>${pc(reel,2)}</b><em class="ok" style="background:#f3ece8;color:#5e4f48">assurance comprise, hors frais</em></div></div>
  <div style="overflow-x:auto"><table class="prets"><tr><th>Prêt</th><th>Montant</th><th>Taux</th><th>Assurance</th><th>Durée</th><th>Lissé</th><th>1<sup>re</sup> mensualité</th><th>Coût</th></tr>
  ${lignes.map(l=>`<tr><td>${esc(l.nom)}</td><td>${eur(l.montant)}</td><td>${pc(l.taux,2)}</td><td>${pc(l.ass,2)}</td><td>${l.ans} ans</td><td>${l.lisse}</td><td>${eur(l.mens)}</td><td>${eur(l.cout)}</td></tr>`).join('')}
  <tr class="total"><td>Total</td><td>${eur(tot)}</td><td>${pc(moyen,2)}</td><td>${pc(moyenAss,2)}</td><td></td><td></td><td>${eur(flux[0]||0)}</td><td>${eur(lignes.reduce((s,l)=>s+l.cout,0))}</td></tr></table></div>
  <p class="note" style="margin-top:8px">Taux réel du montage : taux unique qui donnerait les mêmes mensualités totales (assurance comprise) pour le même capital emprunté. Le TAEG légal, qui inclut aussi les frais, reste établi par la banque.</p></div>`;

function lignesAmort(vueA,pret){
  const out=window.loanOutputs||[],defs=window.loanDefinitions||[];
  const choisis=out.map((o,i)=>({o,i})).filter(x=>(x.o.amount||0)>0&&(pret==='tous'||String(x.i)===String(pret)));
  const N=Math.max(0,...choisis.map(x=>x.o.arr?.length||0)),mois=[];
  for(let t=0;t<N;t++){let ech=0,int=0,ass=0,crd=0;choisis.forEach(({o})=>{const m=o.arr?.[t];if(m){ech+=m.pay||0;int+=m.interest||0;ass+=m.insurance||0;crd+=m.balance||0}});mois.push({p:t+1,ech,int,ass,cap:ech-int-ass,crd})}
  if(vueA==='mois')return mois;
  const ans=[];for(let a=0;a*12<mois.length;a++){const bloc=mois.slice(a*12,a*12+12);ans.push({p:a+1,ech:bloc.reduce((s,x)=>s+x.ech,0),int:bloc.reduce((s,x)=>s+x.int,0),ass:bloc.reduce((s,x)=>s+x.ass,0),cap:bloc.reduce((s,x)=>s+x.cap,0),crd:bloc[bloc.length-1].crd})}
  return ans;
}

function solvabilite(){
  const p=P(),rows=window.lastRows||[],g=id=>num(m(id)?.value);
  const revenus=fv('income'),detail=g('dg-rev1')>0;
  const charges=Math.max(rows[0]?.[2]||0,g('dg-charges'));
  const mens=Math.max(0,...rows.map(r=>+r[1]||0)),mens1=rows[0]?.[1]||0;
  const adultes=g('dg-rev2')>0?2:1,enfants=g('dg-enfants');
  const resteMin=adultes*p.seuils.resteAdulte+enfants*p.seuils.resteEnfant,reste=revenus-charges-mens;
  const seuil=fv('threshold')||p.seuils.endettement;
  const avant=revenus?charges/revenus*100:0,apres=revenus?(charges+mens)/revenus*100:0;
  const prix=fv('price'),total=prix+fv('notary')+fv('works')+fv('guaranteeFee')+fv('fileFee')+fv('brokerFee'),apport=fv('deposit'),apportPct=total?apport/total*100:0;
  const fraisAcq=fv('notary')+fv('guaranteeFee')+fv('fileFee')+fv('brokerFee');
  const loyer=g('dg-loyer'),saut=mens1-loyer;
  const out=window.loanOutputs||[],emprunte=out.reduce((s,o)=>s+(o.amount||0),0);
  const etat=(v,ok,warn,inverse)=>inverse?(v<=ok?'ok':v<=warn?'warn':'bad'):(v>=ok?'ok':v>=warn?'warn':'bad');
  const ind=[
    {l:"Taux d'endettement après projet",v:pc(apres),r:'≤ '+pc(seuil,0),e:etat(Math.round(apres*10)/10,seuil,seuil+3,true)},
    {l:'Reste à vivre',v:eur(reste)+' / mois',r:'≥ '+eur(resteMin),e:etat(reste,resteMin,resteMin*0.8)},
    {l:'Apport personnel',v:eur(apport)+' ('+pc(apportPct,0)+')',r:'≥ '+pc(p.seuils.apportMin,0)+' du coût',e:apportPct>=p.seuils.apportMin?'ok':apport>=fraisAcq?'warn':'bad'},
    {l:'Saut de charge',v:loyer?eur(saut)+' / mois':'loyer actuel non renseigné',r:'≤ 10 % des revenus',e:!loyer?'warn':etat(revenus?saut/revenus*100:0,10,20,true)},
  ];
  const nb={bad:ind.filter(x=>x.e==='bad').length,warn:ind.filter(x=>x.e==='warn').length};
  const synthese=nb.bad?{e:'bad',t:'Dossier fragile',d:'Au moins un indicateur dépasse nettement les repères de l\'équipe.'}:nb.warn?{e:'warn',t:'Dossier à renforcer',d:'Les grands équilibres sont tenus, mais un point mérite d\'être consolidé.'}:{e:'ok',t:'Dossier solide',d:'Tous les indicateurs respectent les repères de l\'équipe.'};
  return {revenus,detail,g,charges,mens,mens1,adultes,enfants,resteMin,reste,seuil,avant,apres,prix,total,apport,apportPct,loyer,saut,emprunte,ind,synthese};
}

function lierCredits(){

  $('sd-cr-add').onclick=()=>{const l=lire();l.push({nature:'conso',mens:0,crd:0,mois:0,ind:0,mode:'keep'});ecrire(l,true)};
  box.querySelectorAll('[data-suppr]').forEach(b=>b.onclick=()=>{const l=lire();l.splice(+b.dataset.suppr,1);ecrire(l,true)});
  box.querySelectorAll('.cr-item').forEach(it=>{const i=+it.dataset.i;
    it.querySelectorAll('[data-c]').forEach(f=>f.addEventListener('input',()=>{const l=lire();l[i][f.dataset.c]=f.dataset.c==='nature'?f.value:num(f.value);ecrire(l,false)}));

  });
}

/** Évolution des remboursements (prêt lissé + PTZ) avec la barre de mensualité déplaçable, et l'enveloppe par durée. */
function echelleRemb(d){const max=Math.max(100,d.revenus*0.5);const pas=[100,250,500,1000,2000,5000].find(p=>max/p<=6)||5000;return {top:Math.ceil(max/pas)*pas,pas}}
function grapheRemb(d,c){
  const W=600,H=470,L=62,R=14,T=24,B=30,PW=W-L-R,PH=H-T-B,{top,pas}=echelleRemb(d);
  const z=c.ptz||{montant:0},deb=(z.differe||0)*12,fin=(z.duree||0)*12,mensZ=z.montant&&fin>deb?z.montant/(fin-deb):0;
  let mois=Math.max(c.n,z.montant?fin:0,...(c.ext||[]).map(x=>x.mois));const ansMax=Math.max(25,Math.ceil(Math.max(c.n,z.montant?fin:0,...(c.ext||[]).map(x=>x.mois))/12/5)*5);
  const ext=c.ext||[],partExt=t=>ext.reduce((a,x)=>a+(!x.horsLissage&&!x.existant&&t<=x.mois?x.mens:0),0),partLisse=t=>ext.reduce((a,x)=>a+(x.existant&&!x.horsLissage&&t<=x.mois?x.mens:0),0),partHors=t=>ext.reduce((a,x)=>a+(x.horsLissage&&t<=x.mois?x.mens:0),0);
  const partPTZ=t=>z.montant?(t<=Math.min(fin,c.n)?z.montant*c.ins:0)+(t>deb&&t<=fin?mensZ:0):0;
  // Crédits en cours conservés sans lissage : ils s'ajoutent au-dessus des nouveaux prêts jusqu'à leur fin.
  const gardes=(d.credits||[]).filter(k=>k.mode==='keep'&&+k.mens>0);mois=Math.max(mois,...gardes.map(k=>Math.round(+k.mois)||0));
  const partGarde=t=>gardes.reduce((a,k)=>a+(!(+k.mois>0)||t<=+k.mois?+k.mens:0),0);
  const x=t=>L+t/(ansMax*12)*PW,y=v=>T+PH-Math.min(v,top)/top*PH;
  // Paliers : on ne garde que les mois où la répartition change.
  const pts=[];for(let t=1;t<=mois;t++){const pz=partPTZ(t),pe=partExt(t),pl=partLisse(t),ph=partHors(t),pk=partGarde(t),pb=t<=c.n?Math.max(0,c.mensualite-pz-pe-pl):0;const der=pts[pts.length-1];if(!der||Math.abs(der.pz-pz)>0.5||Math.abs(der.pb-pb)>0.5||Math.abs(der.pe-pe)>0.5||Math.abs(der.pl-pl)>0.5||Math.abs(der.ph-ph)>0.5||Math.abs(der.pk-pk)>0.5)pts.push({t0:t-1,pz,pe,pl,pb,ph,pk,t1:t});else der.t1=t}
  let g='';for(let v=0;v<=top;v+=pas)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#efe5df"></line><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="#8a7a70">${new Intl.NumberFormat('fr-FR').format(v)} €</text>`;
  for(let a=0;a<=ansMax;a+=5)g+=`<text x="${x(a*12)}" y="${H-8}" text-anchor="${a===0?'start':a===ansMax?'end':'middle'}" font-size="13" fill="#8a7a70">${a===0?'départ':a+' ans'}</text>`;
  const blocs=pts.map(p=>{const x0=x(p.t0),w=Math.max(1,x(p.t1)-x0-2),hb=PH*p.pb/top,hz=PH*p.pz/top,he=PH*p.pe/top,hh=PH*p.ph/top,hk=PH*p.pk/top,hl=PH*p.pl/top;
    const tip=`<b>De l'an ${Math.floor(p.t0/12)+1} à l'an ${Math.ceil(p.t1/12)}</b><br>Prêt bancaire : ${eur(p.pb)}${z.montant?'<br>PTZ : '+eur(p.pz):''}${p.pe?'<br>Autres prêts : '+eur(p.pe):''}${p.pl?'<br>Crédits en cours (lissés) : '+eur(p.pl):''}${p.pk?'<br>Crédits en cours conservés : '+eur(p.pk):''}${p.ph?'<br>Prêt relais (en plus) : '+eur(p.ph):''}<br>Total : ${eur(p.pb+p.pz+p.pe+p.pl+p.ph+p.pk)} / mois`;
    return `<g data-tip="${tip.replace(/"/g,'&quot;')}">${hz>0.5?`<rect x="${x0}" y="${y(p.pz)}" width="${w}" height="${hz}" fill="${C.aide}" rx="3"></rect>`:''}${hk>0.5?`<rect x="${x0}" y="${y(p.pz+p.pe+p.pl+p.pb+p.pk)}" width="${w}" height="${Math.max(0,hk-2)}" fill="#8f8079" rx="3"></rect>`:''}${hh>0.5?`<rect x="${x0}" y="${y(p.pz+p.pe+p.pl+p.pb+p.pk+p.ph)}" width="${w}" height="${Math.max(0,hh-2)}" fill="${C.apport}" rx="3"></rect>`:''}${he>0.5?`<rect x="${x0}" y="${y(p.pz+p.pe)}" width="${w}" height="${Math.max(0,he-(hz>0.5?2:0))}" fill="${C.frais}" rx="3"></rect>`:''}${hl>0.5?`<rect x="${x0}" y="${y(p.pz+p.pe+p.pl)}" width="${w}" height="${Math.max(0,hl-(hz+he>0.5?2:0))}" fill="#8f8079" rx="3"></rect>`:''}${hb>0.5?`<rect x="${x0}" y="${y(p.pz+p.pe+p.pl+p.pb)}" width="${w}" height="${Math.max(0,hb-(hz+he+hl>0.5?2:0))}" fill="${C.main}" opacity=".85" rx="3"></rect>`:''}</g>`}).join('');

  const ligne=`<g class="remb-barre" style="cursor:ns-resize"><rect x="${L}" y="${yl-10}" width="${PW}" height="20" fill="transparent"></rect><line x1="${L}" x2="${W-R}" y1="${yl}" y2="${yl}" stroke="#2b2320" stroke-width="2"></line><circle cx="${W-R-6}" cy="${yl}" r="9" fill="#fff" stroke="#2b2320" stroke-width="2"></circle><text x="${W-R-18}" y="${yl-8}" text-anchor="end" font-size="15" font-weight="700" fill="#2b2320">${eur(c.mensualite)} · ${pc(pct)}</text></g>`;
  return `<svg class="remb-svg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution des remboursements mensuels" style="touch-action:none;user-select:none" data-top="${top}" data-t="${T}" data-ph="${PH}" data-h="${H}">${g}${blocs}${ligne}</svg>
  <div class="legend"><span><i style="background:${C.main}"></i>Prêt bancaire (lissé)</span>${z.montant?`<span><i style="background:${C.aide}"></i>PTZ</span>`:''}${ext.some(e=>!e.horsLissage&&!e.existant)?`<span><i style="background:${C.frais}"></i>${ext.filter(e=>!e.horsLissage&&!e.existant).map(e=>e.nom).filter((v,i,t)=>t.indexOf(v)===i).join(', ')}</span>`:''}${ext.some(e=>e.existant&&!e.horsLissage)?`<span><i style="background:#8f8079"></i>${ext.filter(e=>e.existant&&!e.horsLissage).map(e=>esc(e.nom)+' ('+eur(e.mens)+'/mois, '+e.mois+' mois)').join(', ')}</span>`:''}${gardes.length?`<span><i style="background:#8f8079"></i>${gardes.map(k=>esc(NATURES[k.nature]||'Crédit')+' conservé ('+eur(+k.mens)+'/mois'+(+k.mois>0?', '+Math.round(+k.mois)+' mois':'')+')').join(', ')}</span>`:''}${ext.some(e=>e.horsLissage)?`<span><i style="background:${C.apport}"></i>Prêt relais (non lissé)</span>`:''}<span><i style="background:#2b2320;height:2px"></i>Mensualité maximale : glissez la barre</span></div>`;
}

/** Pour chaque année de revente : capital restant dû des prêts du projet (banque, PTZ, autres nouveaux prêts), capital remboursé et somme récupérée,
 *  au prix d'achat (hypothèse prudente) et, si une revalorisation annuelle est saisie, au prix revalorisé. */
function tremplin(d,c){
  const ech=echeancier(c),projet=new Set(['Prêt bancaire','PTZ',...(c.ext||[]).filter(x=>!x.existant&&!x.horsLissage).map(x=>x.nom)]);
  const prets=ech.prets.filter(p=>p.nom==='PTZ'||p.nom.startsWith('Prêt bancaire')||projet.has(p.nom)&&!p.horsLissage);
  const emprunte=prets.reduce((a,p)=>a+p.montant,0),frais=d.apport+emprunte-c.budget,ans=Math.max(1,Math.round(c.n/12)),r=revalTremplin()/100;
  const lignes=[];for(let a=1;a<=ans;a++){let crd=0,verse=0,cout=0;prets.forEach(p=>{const t=Math.min(a*12,p.lignes.length);crd+=a*12<=p.lignes.length?p.lignes[a*12-1].crd:0;for(let i=0;i<t;i++){verse+=p.lignes[i].pay;cout+=p.lignes[i].int+p.lignes[i].ins}});
    crd=Math.max(0,crd);const prix=c.budget*Math.pow(1+r,a);lignes.push({a,crd,rembourse:emprunte-crd,recupere:c.budget-crd,prix,recupereReval:prix-crd,verse,cout})}

}

  ext.forEach(x=>{const p={nom:x.nom,montant:x.montant,taux:x.taux||0,mois:x.mois,lignes:[],horsLissage:x.horsLissage};let crd=x.montant;const r=(x.taux||0)/1200,relais=/relais/i.test(x.nom);

/** Projection année par année d'un investissement locatif pour un régime donné. */

  if(regime==='lmnp_micro'&&loyerReg*12>77700){res.ok=false;res.motif='Loyers au-dessus de 77 700 €/an.'}

  if(den&&!(x.type==='ancien_tx'&&x.travaux>=0.25*(x.prix+x.travaux))){res.ok=false;res.motif='Ancien avec travaux d’au moins 25 % du coût total.'}
  if(mal&&!x.travaux){res.ok=false;res.motif='Réservé aux travaux de restauration.'}
  if(lli&&x.type!=='vefa'){res.ok=false;res.motif='Logement neuf uniquement.'}
  if(lli&&res.ok)res.info='Achat par une société (SCI familiale possible), loyer et ressources plafonnés.';
  if(jb&&res.ok)res.info=(lli?'Achat par une société (SCI familiale possible), ':'')+'immeuble collectif uniquement, loyer et ressources plafonnés.';
  if(dom&&!(x.type==='ancien_tx'&&x.travaux>=0.25*(x.prix+x.travaux))){res.ok=false;res.motif='Ancien avec travaux d\u2019au moins 25 % du coût total, en outre-mer.'}

    let int=0,cap=0;for(let k=0;k<12;k++){const t=(y-1)*12+k;if(t>=n||crd<=0)break;const i=crd*r;int+=i;cap+=ann-i;crd=Math.max(0,crd-(ann-i))}

     ${L.map(l=>{const v=pm(l);return `<tr><td>${l.y}</td><td>${mo(l.loyers/12,'+ ')}</td><td>${mo(l.credit/12,'− ')}</td><td>${mo(l.charges/12,'− ')}</td><td>${mo(l.impot/12,'− ')}</td><td>${mo(l.reduction/12,'+ ')}</td><td style="font-weight:700;color:${v>0.5?'#a34d31':'#2f8a5a'}">${sg(v)}</td><td><span style="display:inline-block;height:10px;border-radius:3px;width:${Math.round(Math.abs(v)/max*130)}px;background:${v>0?'#a34d31':'#2f8a5a'}"></span></td></tr>`}).join('')}
     <tr style="font-weight:700;background:#fbf3ee"><td>Moyenne</td><td>${mo(moy(l=>l.loyers),'+ ')}</td><td>${mo(moy(l=>l.credit),'− ')}</td><td>${mo(moy(l=>l.charges),'− ')}</td><td>${mo(imp,'− ')}</td><td>${mo(red,'+ ')}</td><td>${sg(moy(l=>pm(l)*12))}</td><td></td></tr></table></div>`;

    const alP=d.prets.find(x=>x.neufSeul);if(alP){const a=alP;poser('alElig',true);poser('useAction',true);poser('action',a.montant);poser('actionRate',a.taux);poser('actionYears',a.ans)}else{poser('alElig',false);poser('useAction',false);poser('action',0)}
    poser('rentCharge',0);poser('enfants',d.enfants);
    const ass=d.ass==null?assDefaut():d.ass,q=r2?P().assurance.quotiteCouple:100;

/**
 * Téléchargement en vrai fichier PDF (sans passer par la fenêtre d'impression) : le document est mis en page
 * dans un cadre invisible à la largeur utile d'une page A4 (190 mm ≈ 718 px), puis converti par html2pdf (servi par le site, dans public/vendor).
 */
const PDF_LIB=location.origin+'/vendor/html2pdf-0.10.1.bundle.min.js';
async function telechargerPDF(titreDoc,sections,nom,bouton){
  const texte=bouton?.textContent;if(bouton){bouton.disabled=true;bouton.textContent='Préparation du PDF…'}
  const f=document.createElement('iframe');f.style.cssText='position:fixed;left:-10000px;top:0;width:718px;height:1200px;border:0';document.body.appendChild(f);
  try{
    const doc=f.contentDocument;doc.open();doc.write(docHtml(titreDoc,sections).replace('</head>',`<style>.fs td{padding:3px 8px}.fs{margin-bottom:9px}.doc-section{margin-bottom:0}.doc-section>.st-res{padding-bottom:0!important;margin-bottom:0!important}.doc-tete{margin-bottom:12px}</style><script src="${PDF_LIB}"><\/script></head>`));doc.close();
    await new Promise((ok,ko)=>{let n=0;const t=setInterval(()=>{if(f.contentWindow.html2pdf&&doc.readyState==='complete'){clearInterval(t);ok()}else if(++n>150){clearInterval(t);ko(new Error('bibliothèque PDF indisponible (connexion internet ?)'))}},100)});
    await Promise.all([...doc.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    // Les graphiques SVG sont convertis en image : leurs couleurs définies en CSS doivent être recopiées sur chaque forme.
    doc.querySelectorAll('svg').forEach(v=>{const r=v.getBoundingClientRect();if(r.width&&r.height){v.setAttribute('width',r.width);v.setAttribute('height',r.height)}});
    doc.querySelectorAll('svg *').forEach(e=>{const c=f.contentWindow.getComputedStyle(e);['fill','stroke','stroke-width','opacity','fill-opacity','stroke-dasharray','font-size','font-weight','font-family'].forEach(k=>{const v=c.getPropertyValue(k);if(v)e.setAttribute(k,v)})});
    const jour=new Date().toISOString().slice(0,10),fichier=[titreDoc,nom,jour].filter(Boolean).join(' - ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w .,'()-]/g,'')+'.pdf';
    // Options recréées dans le cadre : html2pdf vérifie les tableaux avec instanceof, propre à chaque fenêtre.
    const options=f.contentWindow.JSON.parse(JSON.stringify({margin:[10,10,10,10],image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css'],avoid:['tr','.card:not(.longue)','.tile','.hero','.fs-hcsf']}}));
    const blob=await f.contentWindow.html2pdf().set(options).from(doc.getElementById('pt-studio')).outputPdf('blob');
    // Copie du fichier dans la fenêtre principale : le cadre est supprimé juste après.
    const pdf=new Blob([await blob.arrayBuffer()],{type:'application/pdf'});
    const a=document.createElement('a');a.href=URL.createObjectURL(pdf);a.download=fichier;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  }catch(e){alert('PDF impossible : '+e.message+'. Utilisez « Imprimer » puis « Enregistrer au format PDF ».')}
  finally{f.remove();if(bouton){bouton.disabled=false;bouton.textContent=texte}}
}
function imprimerDoc(titreDoc,sections){
  const html=docHtml(titreDoc,sections);
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const doc=f.contentDocument;doc.open();doc.write(html);doc.close();
  const imprimer=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){alert('Impression impossible : '+e.message)}setTimeout(()=>f.remove(),60000)};
  const img=doc.querySelector('img');if(img&&!img.complete){img.onload=img.onerror=()=>setTimeout(imprimer,100)}else setTimeout(imprimer,250);
}
